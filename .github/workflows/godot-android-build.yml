name: Build Godot Android APK

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export-android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android APK via godot-export
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: godot
          archive_output: false
          use_preset_export_path: true
          export_debug: true
          presets_to_export: Android
          verbose: true

      - name: Locate built APK
        id: find_apk
        run: |
          echo "build_directory output: ${{ steps.export.outputs.build_directory }}"
          APK_PATH=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: farmworld-android-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Create/update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Farm World (Android, latest build)
          body: Automatically built debug APK from the latest push to `godot/`. Not signed for release — install directly on a device with "install from unknown sources" enabled, or use it for testing.
          prerelease: true
          files: ${{ steps.find_apk.outputs.apk_path }}
