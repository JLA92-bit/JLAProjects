name: Deploy Farm World to GitHub Pages

on:
  push:
    branches: [main, claude/sweet-brahmagupta-q8ikud]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Non-blocking: a failure here must never take down the main HTML/JS game,
      # which is the primary, already-working deployment.
      - name: Export Godot Web build
        id: godot_web_export
        continue-on-error: true
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          relative_project_path: godot
          archive_output: false
          use_preset_export_path: true
          presets_to_export: Web

      - name: Move Godot Web build into the Pages site (if it succeeded)
        if: steps.godot_web_export.outcome == 'success'
        run: |
          # use_preset_export_path copies the build into a subfolder named
          # after the export preset itself ("Web"), so the real output is
          # one level deeper than godot/web/index.html - that mismatch made
          # this step silently skip on every run despite the export working.
          if [ -f godot/web/Web/index.html ]; then
            mkdir -p godot-play
            cp -r godot/web/Web/* godot-play/
          else
            echo "Godot web export produced no index.html - skipping."
          fi

      - name: Update puzzle-cascade/version.json for the in-app update checker
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, datetime, pathlib, os

          # The run number always increases across deploys, so it's a simple,
          # reliable version counter with no read-modify-write races (unlike
          # bumping a number stored in the committed version.json, which would
          # just reset to the same value every deploy since git never sees
          # this file's runtime-generated content).
          run_number = os.environ["RUN_NUMBER"]
          new_version = f"1.0.{run_number}"

          commit_sha = subprocess.check_output(["git", "rev-parse", "--short", "HEAD"]).decode().strip()
          today = datetime.date.today().isoformat()

          # Notes for this release: subjects of every commit since the last
          # deployed version tag, falling back to the latest few commits on
          # the very first run (no prior tag to diff against yet).
          tag_name = "last-deployed-pages"
          try:
              prev_sha = subprocess.check_output(
                  ["git", "rev-parse", tag_name], stderr=subprocess.DEVNULL
              ).decode().strip()
              log_range = f"{prev_sha}..HEAD"
          except subprocess.CalledProcessError:
              log_range = "-5"  # first run: just show recent history

          if log_range == "-5":
              subjects = subprocess.check_output(["git", "log", "-5", "--pretty=%s"]).decode().splitlines()
          else:
              subjects = subprocess.check_output(["git", "log", log_range, "--pretty=%s"]).decode().splitlines()
          notes = [s for s in subjects if s.strip()] or ["Routine update."]

          path = pathlib.Path("puzzle-cascade/version.json")
          data = json.loads(path.read_text()) if path.exists() else {"changelog": []}
          data["version"] = new_version
          data["commit"] = commit_sha
          data["builtAt"] = datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")
          changelog = data.get("changelog", [])
          changelog.insert(0, {"version": new_version, "date": today, "notes": notes})
          data["changelog"] = changelog[:30]

          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"version.json -> v{new_version} ({commit_sha}), {len(notes)} note(s)")
          PYEOF
          git tag -f last-deployed-pages HEAD
          git push -f origin last-deployed-pages || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
