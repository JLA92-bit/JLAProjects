<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#141110" />
<meta name="description" content="Vantage Point 3D - a noir detective game with fully explorable 3D crime scenes (Level 1 prototype)." />
<title>Vantage Point 3D (prototype)</title>
<link rel="stylesheet" href="../vantage-point/src/style.css" />
<link rel="stylesheet" href="src/style-3d.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="app" class="app"></div>

<template id="tpl-welcome">
  <section class="screen screen-welcome">
    <div class="film-grain"></div>
    <div class="welcome-content">
      <p class="kicker">VANTAGE POINT — 3D PROTOTYPE</p>
      <h1>Welcome, Detective.</h1>
      <p class="welcome-text">This build is a prototype: Level 1 ("The Study") is a fully explorable 3D room. Levels 2-5 aren't modeled yet — the case still ends honestly at the accusation screen, using whatever you actually found.</p>
      <label class="name-field">
        <span class="name-label">Detective</span>
        <input class="name-input" data-role="name-input" type="text" maxlength="24" autocomplete="off" autocapitalize="words" placeholder="Your name" />
      </label>
      <button class="btn btn-primary" data-action="confirm-name">Report for Duty</button>
    </div>
  </section>
</template>

<template id="tpl-intro">
  <section class="screen screen-intro">
    <div class="film-grain"></div>
    <div class="intro-content">
      <p class="kicker" data-bind="detectiveGreeting"></p>
      <h1 class="case-title" data-bind="title"></h1>
      <p class="case-tagline" data-bind="tagline"></p>
      <p class="case-briefing" data-bind="briefing"></p>
      <div class="suspect-strip" data-bind="suspectStrip"></div>
      <button class="btn btn-primary" data-action="start-case">Open the Case</button>
    </div>
  </section>
</template>

<template id="tpl-level-intro">
  <section class="screen screen-level-intro">
    <div class="film-grain"></div>
    <div class="level-intro-content">
      <p class="kicker" data-bind="day"></p>
      <h2 data-bind="title"></h2>
      <p class="level-location" data-bind="location"></p>
      <p class="level-intro-text" data-bind="intro"></p>
      <p class="level-intro-hint">Drag to look around. Pinch (or scroll) to zoom. Tap an object to inspect it.</p>
      <button class="btn btn-primary" data-action="enter-scene">Step Into the Room</button>
    </div>
  </section>
</template>

<template id="tpl-scene3d">
  <section class="screen screen-scene3d">
    <header class="scene-hud">
      <button class="icon-btn" data-action="open-casefile" aria-label="Case file">🗂</button>
      <div class="scene-progress">
        <span data-bind="day"></span>
        <div class="clue-pips" data-bind="cluePips"></div>
      </div>
      <button class="icon-btn" data-action="reset-view" aria-label="Reset view">⤾</button>
    </header>

    <div class="scene3d-viewport" data-role="viewport">
      <canvas data-role="canvas"></canvas>
      <div class="vignette-overlay"></div>
    </div>

    <footer class="scene-toolbar">
      <button class="btn btn-primary btn-continue" data-action="finish-level" hidden>Continue →</button>
    </footer>

    <div class="clue-toast" data-role="toast" hidden>
      <div class="clue-toast-card">
        <p class="clue-toast-title" data-bind="toastTitle"></p>
        <p class="clue-toast-flavor" data-bind="toastFlavor"></p>
      </div>
    </div>
  </section>
</template>

<template id="tpl-casefile">
  <section class="screen screen-casefile">
    <header class="casefile-header">
      <div>
        <h2>Case File</h2>
        <p class="casefile-detective" data-bind="detectiveLine"></p>
      </div>
      <button class="icon-btn" data-action="close-casefile" aria-label="Close">✕</button>
    </header>
    <div class="corkboard" data-role="corkboard"></div>
  </section>
</template>

<template id="tpl-accusation">
  <section class="screen screen-accusation">
    <div class="film-grain"></div>
    <div class="accusation-content">
      <p class="kicker">FINAL ACCUSATION</p>
      <h2>Who did it? Why? With what?</h2>
      <p class="accusation-help">Prototype note: only Level 1 is modeled, so most evidence is still out there. Choose from what you actually found.</p>

      <div class="accusation-group">
        <h3>Suspect</h3>
        <div class="choice-list" data-role="suspect-choices"></div>
      </div>
      <div class="accusation-group">
        <h3>Motive</h3>
        <div class="choice-list" data-role="motive-choices"></div>
      </div>
      <div class="accusation-group">
        <h3>Key Evidence</h3>
        <div class="choice-list" data-role="evidence-choices"></div>
      </div>

      <button class="btn btn-primary" data-action="submit-accusation" disabled>Make the Accusation</button>
    </div>
  </section>
</template>

<template id="tpl-ending">
  <section class="screen screen-ending">
    <div class="film-grain"></div>
    <div class="ending-content">
      <p class="kicker" data-bind="stamp"></p>
      <h1 data-bind="headline"></h1>
      <p class="ending-explanation" data-bind="explanation"></p>
      <p class="ending-signoff" data-bind="signoff"></p>
      <button class="btn btn-primary" data-action="restart-case">Start a New Investigation</button>
    </div>
  </section>
</template>

<script type="module" src="src/main.js"></script>
</body>
</html>
