<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Josh Makes Puzzles</title>
<meta name="description" content="Josh Makes Puzzles - a 50-game puzzle collection with a Candy Crush-style level path.">
<meta name="theme-color" content="#6a2dd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link rel="stylesheet" href="shared/css/theme.css">
<link rel="stylesheet" href="shared/css/layout.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>

<div class="pc-app">
  <header class="pc-header" id="pc-header">
    <div class="pc-logo pc-display">
      <span class="pc-logo-mark">🧩</span>
      <span>Josh Makes Puzzles</span>
    </div>
    <button class="pc-icon-btn" id="pc-settings-btn" type="button" aria-label="Settings">⚙️</button>
  </header>

  <!-- ============================== HUB ============================== -->
  <section id="pc-hub">
    <div class="pc-hub-top">
      <p class="pc-greeting" id="pc-greeting" hidden></p>
      <div class="pc-hub-stats">
        <div class="pc-stat" title="Stars collected on the Adventure map"><span class="pc-stat-icon" aria-hidden="true">⭐</span><b id="pc-stat-stars">0</b><span class="pc-stat-label">stars</span></div>
        <div class="pc-stat" title="Days in a row you've played"><span class="pc-stat-icon" aria-hidden="true">🔥</span><b id="pc-stat-streak">0</b><span class="pc-stat-label">day streak</span></div>
        <div class="pc-stat" title="Your current world and level"><b id="pc-stat-world">1-1</b><span class="pc-stat-label">world</span></div>
      </div>
    </div>

    <div class="pc-hub-tabs" role="tablist">
      <button class="pc-hub-tab is-active" id="pc-tab-path" data-tab="path" type="button" role="tab" aria-selected="true">🗺️ Adventure</button>
      <button class="pc-hub-tab" id="pc-tab-free" data-tab="free" type="button" role="tab" aria-selected="false">🎮 All Games</button>
    </div>

    <div class="pc-hub-panel pc-hub-panel--map" id="pc-panel-path">
      <div class="pc-map" id="pc-level-path"></div>
      <button class="pc-map-play" id="pc-map-play" type="button">▶ Play</button>
    </div>

    <div class="pc-hub-panel pc-hub-panel--free" id="pc-panel-free" hidden>
      <div class="pc-progress-card">
        <div class="pc-progress-row">
          <span id="pc-progress-label">0% complete</span>
          <span id="pc-streak-label">Play today to start a streak!</span>
        </div>
        <div class="pc-progress-track"><div class="pc-progress-fill" id="pc-progress-fill"></div></div>
      </div>
      <button class="pc-continue" id="pc-continue" type="button" hidden></button>
      <div class="pc-filter-bar">
        <input type="search" id="pc-search" class="pc-search" placeholder="🔍 Search games..." aria-label="Search games" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <div class="pc-chips" id="pc-filter-chips" aria-label="Filter by category"></div>
      </div>
      <div class="pc-grid" id="pc-puzzle-grid"></div>
      <p class="pc-empty" id="pc-grid-empty" hidden></p>
    </div>
  </section>

  <!-- ============================ GAME VIEW ============================ -->
  <section id="pc-game-view" class="pc-game-view" hidden>
    <div class="pc-game-header">
      <div class="pc-game-header-left">
        <button class="pc-icon-btn" id="pc-back-btn" type="button" aria-label="Back to hub">←</button>
        <h2 id="pc-game-title" class="pc-display pc-game-title"></h2>
      </div>
      <div class="pc-game-header-right">
        <button class="pc-btn pc-btn--ghost pc-hint-btn" id="pc-hint-btn" type="button" hidden>💡 Hint</button>
        <button class="pc-icon-btn pc-restart-btn" id="pc-restart-btn" type="button" aria-label="Restart round" title="Restart round" hidden>🔄</button>
        <div class="pc-game-timer" id="pc-game-timer">0:00</div>
      </div>
    </div>

    <div class="pc-difficulty-bar" id="pc-difficulty-bar"></div>

    <div class="pc-stage" id="pc-game-stage"></div>
  </section>
</div>

<!-- Shared systems -->
<script src="shared/js/save-manager.js"></script>
<script src="shared/js/sound-manager.js"></script>
<script src="shared/js/ui.js"></script>
<script src="shared/js/update-checker.js"></script>
<script src="shared/js/app.js"></script>

<!-- Game modules are NOT listed here: app.js lazy-loads each game's JS
     (via import(), so it can `import * as THREE from 'three'` through the
     import map above) and CSS the first time that puzzle is launched. -->
<script>
  // Always show the latest pushed build: force a fresh check of sw.js on
  // every launch (never trust a stale cached copy of the service worker
  // itself) and reload once when a new version takes over. This only
  // replaces cached game files/assets - localStorage (all saves, stars,
  // unlocked puzzles, player name) lives outside the Cache API entirely,
  // so it's never touched by this.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
        reg.update().catch(() => {});
      }).catch(() => {});
    });
    let reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloadedForUpdate) return;
      reloadedForUpdate = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
